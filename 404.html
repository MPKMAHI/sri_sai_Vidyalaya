<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Sai Vidyalaya — Redirecting</title>
    <script>
        (function() {
            var pathname = window.location.pathname;
            var search = window.location.search || '';
            var hash = window.location.hash || '';

            // Handle /app or /app/
            if (pathname === '/app' || pathname === '/app/') {
                window.location.replace('/app/' + search + hash);
                return;
            }
            // Handle /app/subroute
            if (pathname.startsWith('/app/')) {
                var sub = pathname.replace(/^\/app\//, '');
                window.location.replace('/app/#/' + sub + search + hash);
                return;
            }
            // Fallback to home
            window.location.replace('/' + search + hash);
        })();
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 48px; background: #090d16; color: #f8fafc;">
    <h2 style="margin-bottom: 8px; font-weight: 700;">Sri Sai Vidyalaya High School</h2>
    <p style="color: #94a3b8;">Redirecting to <a href="/app/" style="color: #06b6d4; text-decoration: none; font-weight: 600;">SSV SchoolSphere Application</a>...</p>
</body>
</html>
